name: Release

# Runs on a pushed tag vYYYY.M.MICRO created by `python scripts/release.py`.
# Order: the tag must match the project version and the full CI must pass
# before anything is built; PyPI publishing uses trusted publishing (OIDC),
# no API token.

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  POETRY_VERSION: "2.4.3"

jobs:
  version:
    name: Tag matches the project version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compare the tag with the version files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - "$TAG" <<'PY'
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          with open("src/groundfield/__init__.py", encoding="utf-8") as handle:
              init = re.search(r'^__version__ = "([^"]+)"', handle.read(), re.M)
          with open("CITATION.cff", encoding="utf-8") as handle:
              cff = re.search(r'^version:\s*"?([^"\s]+)"?', handle.read(), re.M)
          calver = (
              r"[1-9]\d{3}\.(?:[1-9]|1[0-2])\.(?:0|[1-9]\d*)"
              r"(?:(?:a|b|rc)(?:0|[1-9]\d*))?(?:\.post(?:0|[1-9]\d*))?"
              r"(?:\.dev(?:0|[1-9]\d*))?"
          )
          errors = []
          if tag != f"v{version}":
              errors.append(f"tag {tag} does not match pyproject.toml version {version}")
          found = {version, init and init[1], cff and cff[1]}
          if len(found) != 1:
              errors.append(f"version files disagree: {sorted(map(str, found))}")
          if not re.fullmatch(calver, version):
              errors.append(f"{version} is not a calendar version YYYY.M.MICRO")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print(f"tag {tag} matches version {version}")
          PY

  ci:
    name: Test gate
    # A job-level reusable workflow is resolved by GitHub from this commit,
    # not from the runner's file system; the "$/" self-repository form is not
    # understood by actionlint yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build sdist and wheel
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Build distributions
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/groundfield
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the distributions
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release with the GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag)
          if [[ "$TAG" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
