      - "02 — Comparison of the solver engines": examples/02_engine_comparison.md
      - "03 — Multi-layer soil models": examples/03_multilayer_soil.md
      - "04 — Interconnected grounding system": examples/04_interconnected_grounding.md
      - "05 — Analysing inductive coupling": examples/05_inductive_coupling.md
      - "06 — Create a TN-Model": examples/06_tn_model.md
      - "07 — Comparison of measurement distances": examples/07_measurement_distance.md
      - "08 — OSM pipeline with simulation results": examples/08_osm_pipeline.md
