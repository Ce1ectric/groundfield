  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Tutorials:
      - tutorials/index.md
      - "T01 First grounding impedance": tutorials/T01_first_grounding_impedance.ipynb
      - "T02 Layered soil": tutorials/T02_layered_soil.ipynb
      - "T03 Interconnected systems and impedances": tutorials/T03_interconnected_systems_and_impedances.ipynb
      - "T04 Frequency response and rho-f": tutorials/T04_frequency_response_and_rho_f.ipynb
      - "T05 Export to groundinsight": tutorials/T05_export_to_groundinsight.ipynb
      - "T06 TN network, synthetic and OSM": tutorials/T06_tn_network_synthetic_and_osm.ipynb
      - "T07 Fall-of-potential measurement": tutorials/T07_fall_of_potential_measurement.ipynb
      - "T08 Touch and step voltage": tutorials/T08_touch_and_step_assessment.ipynb
      - "T09 Choosing an engine, convergence": tutorials/T09_choosing_an_engine_and_convergence.ipynb
      - "T10 Reproducible studies": tutorials/T10_reproducible_studies.ipynb
  - How-to guides:
      - how-to/index.md
      - "Install the optional extras": how-to/install-extras.md
      - "Run sweeps and Monte Carlo studies": how-to/sweeps-and-monte-carlo.md
      - "Speed up large studies": how-to/speed-up-large-studies.md
      - "Plot results": how-to/plot-results.md
      - "Model the inductive coupling of cables and leads": how-to/inductive-coupling.md
      - "Assess touch voltages": how-to/assess-touch-voltages.md
      - "Export to CSV, VTK and ParaView": how-to/export-csv-vtk-paraview.md
      - "Work with OpenStreetMap offline": how-to/osm-offline.md
      - "Read and act on warnings": how-to/warnings-and-diagnostics.md
      - "Contribute to the documentation": how-to/contribute-to-the-docs.md
  - Explanation:
