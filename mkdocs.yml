site_name: groundfield
site_description: Numerical field computation for grounding systems.
site_url: https://ce1ectric.github.io/groundfield/
repo_url: https://github.com/Ce1ectric/groundfield
repo_name: Ce1ectric/groundfield
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Christian Ehlert

# Fail the build on any warning (broken nav entry or link, unresolved
# cross-reference, malformed docstring). Applies to `mkdocs build`,
# `mkdocs serve` and the `mike deploy` step of .github/workflows/docs.yml
# alike, so a docstring regression cannot ship unnoticed.
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github
  # No Google Fonts: system fonts, no request to fonts.googleapis.com
  # from the reader's browser (GDPR).
  font: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  # No Mermaid fence: Material loads mermaid.js from unpkg.com for every
  # page with a diagram (third-party script, finding 10.08). Draw
  # diagrams as text or as vendored images instead.
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Tutorials are Jupyter notebooks under docs/tutorials/, executed by
  # tests/test_tutorials.py and committed with their outputs; the build
  # renders the stored outputs and never runs a kernel (execute: false).
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      # Checked before `include`: keeps the plugin from parsing every
      # Markdown page with jupytext to look for notebook front matter.
      ignore: ["*.md"]
      execute: false
      # Markdown cells go through the MkDocs pipeline of this file:
      # relative links to other pages are resolved and checked by the
      # strict build, `$...$` math is rendered like on every other page
      # and `[FieldResult][groundfield.FieldResult]` cross-references
      # work. (The default "jupyter" mode leaves `../x.md` links broken.)
      markdown_cell_processor: mkdocs
      # Offer the .ipynb file for download next to the rendered page.
      include_source: true
      # The site's own MathJax 3.2.2 (vendored, see extra_javascript) is
      # on every page and is reused by the plugin. The URL below is only
      # the plugin's fallback when no MathJax script is on a page; it
      # points at the vendored copy so that no third-party script can be
      # requested (finding 10.08).
      mathjax_version: 3
      custom_mathjax_url: javascripts/vendor/mathjax/tex-mml-chtml.js
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # Renders the Sphinx roles (:class:`X`, :math:`x`) and
            # `.. math::` blocks of the docstrings as autorefs and
            # arithmatex math (finding 10.85); the source is unchanged.
            extensions:
              - scripts/griffe_rest_roles.py
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2

extra_javascript:
  # MathJax configuration first, then MathJax itself. MathJax 3.2.2 is
  # vendored (docs/javascripts/vendor/mathjax/, byte-identical to the npm
  # tarball, see PROVENANCE.txt and SHA256SUMS there): the site loads no
  # third-party JavaScript (finding 10.08; previously a floating
  # cdn.jsdelivr.net/npm/mathjax@3 URL without integrity check). Fonts and
  # TeX extensions are loaded from the same folder on demand.
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax/tex-mml-chtml.js

extra:
  # Versioned documentation (decision 7): one docs version per calendar
  # release, deployed with mike by .github/workflows/docs.yml. The alias
  # `latest` points at the newest release, `dev` follows main.
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ce1ectric/groundfield

# Diátaxis layout (review pass 10, Appendix B). Pages are owned by the
# docs streams of release 2026.11: getting started and reference (DOC-A),
# tutorials and how-to guides (DOC-B), explanation and ADRs (DOC-C),
# changelog, roadmap and audit history (DOC-D).
