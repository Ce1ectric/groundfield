quantities = ["*"]
findings = ["10.46", "F52"]
reason = "sommerfeld assembles L and the earth-return correction on the image-free baseline (image='none') instead of adding the additive image and removing it again: the same numbers to round-off (<= 4e-18); surface-crossing conductors are accepted. Exact touching pairs (closed forms for chain neighbours) move the 20 m lead by 3.0e-6 and the 60 m PEN by 1.4e-6 on top of COUP-1's lambda-grid change."
min_rel_change = 1e-6
max_rel_change = 1e-4

