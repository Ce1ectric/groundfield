# Stream CORE-2b (review pass 10): cross-layer physics, interface slivers,
# post-solve series controls, mutual matrices, concrete coefficient, line
# kernel as the default. See ../README.md for the format. Every bound below
# was measured on stream/core2b (evidence: /home/claude/deliver/evidence/core2b/).

# --- 10.15 (F02): one owner per (electrode, layer) ----------------------
# Rod 0.5-3.5 m through h_1 = 1 m in 100/1000 Ohm m: the rod carried one
# current density above and below h_1. Measured: Zc / phi -46.5 % (point),
# -48.2 % (line, with the reciprocal line-exact cross-layer correction of
# 10.28); probe potentials 25 % / 34 %; segment currents x3.0 / x3.1.
# Equal to the manual split into two bonded rods.

[[change]]
cases = ["img2_rod_crosslayer", "line_img2_rod_crosslayer", "mutual_three_rods_crosslayer"]
quantities = ["*"]
findings = ["10.15"]
reason = "Rods through the layer interface get one uniform-current owner per layer (F02)."
min_rel_change = 0.1
max_rel_change = 5.0

# --- 10.32: segment count tolerant to floating-point noise --------------
# The three star arms of the mixed-cluster world are 3.0, 2.9999999999999996
# and 3.000000000000001 m long: ceil(L/ds) gave 6 / 6 / 7 segments at ds =
# 0.5 m, now 6 / 6 / 6. Point kernel: <= 6.9e-5 (I/star), line kernel: <=
# 8.3e-8 (straight wires are discretisation-independent with it). The
# touch-voltage quantity is POST's (10.21) and is not matched here.

[[change]]
cases = ["img_mixed_cluster_hom", "line_img_mixed_cluster_hom"]
quantities = ["ps/*"]
findings = ["10.32"]
reason = "A star arm of 3.000000000000001 m is cut into 6 instead of 7 segments at ds = 0.5 m."
allow_shape_change = true

[[change]]
cases = ["img_mixed_cluster_hom"]
quantities = ["phi/*", "I/*", "Zc/*", "potential/*", "safety/step"]
findings = ["10.32"]
reason = "Same discretisation change, point kernel (6 instead of 7 segments on one star arm)."
min_rel_change = 1e-6
max_rel_change = 2e-4

[[change]]
cases = ["line_img_mixed_cluster_hom"]
quantities = ["phi/*", "I/*", "Zc/*", "potential/*"]
findings = ["10.32"]
reason = "Same discretisation change, line kernel: straight wires are exact at any ds."
min_rel_change = 1e-9
max_rel_change = 1e-6

# --- 10.28: the line-source kernel is the default of the image family ----
# Engine.kernel = None (default) lets the backend choose: the exact line
# kernel for the image family. Measured: rod 3 m Zc +0.60 %, surface
# potential up to 1.9 %; two-layer ring Zc +1.23 %, potential 0.10 %; two
# rods with a galvanic conductor of 5 m segments: I 10.9 %, Zc 8.4 %, phi
# 3.4 % (the point kernel is most biased on long segments). Every case pinned
# to kernel="point" stays identical. coup1 also declares
# defaults_mixed_cluster_inductive (1e-7); the bounds add up.

[[change]]
cases = ["defaults_rod_hom", "defaults_two_layer_ring_auto", "defaults_mixed_cluster_inductive"]
quantities = ["*"]
findings = ["10.28"]
reason = "Engine.kernel defaults to the backend's preferred kernel: the exact line-source kernel for the image family."
min_rel_change = 1e-3
max_rel_change = 0.2

# --- 10.29 in solve_mutual_*: the other clusters float (post-merge) -------
# Applied with the post-merge patch of stream core2b, once core2a's floating
# clusters are in: _unit_excitation solves with floating=True, as
# Engine.solve does. The foundation of the distributed-concrete case is four
# perimeter strips bonded into one cluster; floating gives the passive
# foundation its equalising currents. Measured on the merged tree: Z_G
# 5.2e-4, R 1.6 % (field points next to the passive foundation).

[[change]]
cases = ["mutual_foundations_distributed_concrete"]
quantities = ["Z_G", "R"]
findings = ["10.29"]
reason = "solve_mutual_* let the passive clusters float like Engine.solve: bonded groups carry equalising currents."
min_rel_change = 1e-4
max_rel_change = 0.03
