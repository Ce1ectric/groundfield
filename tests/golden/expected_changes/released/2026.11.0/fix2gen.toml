# Expected golden-value changes of work stream FIX2-GEN (audit round 2).
# Format: tests/golden/README.md.
#
# Two changes move the generator cases:
#
# * A2G-04 (10.39, 10.12): a mesh foundation is one uniform-current owner
#   per wire line at every orientation (it was one grid_mesh owner when
#   axis-aligned and bare). One owner over perimeter and braces was +1.5 %
#   (EPR) / +5.2 % (largest touch voltage) above the equipotential reference
#   for the default 10 x 10 m 2 x 2 house mesh; one owner per wire is +0.3 % /
#   +1.5 %. Generated networks: potentials -0.7 ... -0.8 %.
# * PEN routing (10.38 junction nodes; stream DOC-B): the PEN cables of the
#   TN generator form a nearest-point tree. The service drops of the default
#   network ran from the cabinet 180 m out back along the main (60 ... 160 m
#   each); they now tap the main beside each house (5 m). Substation
#   potential -2.1 %, substation leakage -3.1 ... -4.8 %.
#
# Measured against the stream start: deliver/evidence/fix2gen/
# golden_moves_vs_base_routing.txt (both changes), golden_moves_vs_base.txt
# (A2G-04 alone), golden_routing_only.txt (routing alone).

# ---------------------------------------------------------------- gen_tn_default

[[change]]
cases = ["gen_tn_default"]
quantities = ["phi/trafo_*", "phi/kvs_*"]
findings = ["10.39", "10.12", "10.38"]
reason = """Mesh foundations one owner per wire (-0.73 %) and service drops from
the nearest point of the main instead of the cabinet 180 m out (-2.1 % at the
substation): -2.8 % (substation), -1.1 % (cabinet)."""
min_rel_change = 5e-3
max_rel_change = 4e-2

[[change]]
cases = ["gen_tn_default"]
quantities = ["phi/residential_*_foundation_0"]
findings = ["10.39", "10.12", "10.38"]
reason = """House potentials: -0.74 % (owners) and up to +/-1 % (routing), partly
cancelling: 0.17 ... 0.90 %."""
min_rel_change = 1e-3
max_rel_change = 1.5e-2

[[change]]
cases = ["gen_tn_default"]
quantities = ["I/trafo_*", "I/kvs_*"]
findings = ["10.39", "10.12", "10.38"]
reason = """Leakage of the substation and cabinet electrodes: +0.2 ... +0.9 %
(owners) and 3.1 ... 4.8 % (routing); together 1.3 ... 5.0 %."""
min_rel_change = 5e-3
max_rel_change = 7e-2

[[change]]
cases = ["gen_tn_default"]
quantities = ["I/residential_*_foundation_0"]
findings = ["10.39", "10.12"]
reason = """The foundation anchor is now the first wire of the mesh (one of six
owners): its current is that wire's share, -80 ... -81 % of the whole
foundation's current, which is the sum over <name> and <name>_w1 ... _w5."""
min_rel_change = 0.7
max_rel_change = 0.9

[[change]]
cases = ["gen_tn_default"]
quantities = ["phi/residential_*_w*", "I/residential_*_w*"]
findings = ["10.39", "10.12"]
reason = "The other five wires of each mesh foundation are new owners."
allow_shape_change = true

[[change]]
cases = ["gen_tn_default"]
quantities = ["potential/*", "ps/I"]
findings = ["10.39", "10.12", "10.38"]
reason = """Surface potentials and point sources follow the new current
distribution: potential line 4.1 %, point-source currents 6.8 % (norm-wise)."""
min_rel_change = 1e-2
max_rel_change = 0.1

[[change]]
cases = ["gen_tn_default"]
quantities = ["ps/owner", "world/json"]
findings = ["10.39", "10.12", "10.38"]
reason = """Mesh foundations are six polyline electrodes plus five ideal bonds;
the PEN main is split at five tap junctions (pen_tap_0 ... 4)."""
allow_shape_change = true

